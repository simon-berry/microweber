<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tech-Trac UK | Builder demo</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#09111e;color:#e7efff;font:16px system-ui}header{padding:18px 24px;border-bottom:1px solid #29405a;display:flex;gap:16px;align-items:center;flex-wrap:wrap}header strong{color:#49e2f1}small{color:#b6c8dd}main{display:grid;grid-template-columns:310px 1fr;min-height:85vh}aside{padding:22px;background:#101e30}button,input,textarea,select{font:inherit;border:1px solid #425b76;border-radius:6px;padding:10px}button{background:#163548;color:white;cursor:pointer}button:hover{background:#22526a}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #49e2f1}input,textarea,select{width:100%;background:#09111e;color:white;margin:6px 0 14px}textarea{min-height:110px}label{display:block}nav{display:flex;gap:6px;flex-wrap:wrap}section.workspace{padding:22px;overflow:auto}iframe{display:block;margin:20px auto;background:white;border:0;max-width:100%;height:720px;width:100%}.row{display:flex;gap:6px;margin:8px 0}.row button:first-child{flex:1;text-align:left}.selected{border-color:#49e2f1}#notice{padding:10px 24px;background:#183046;margin:0}h2{font-size:18px}hr{border:0;border-top:1px solid #29405a;margin:22px 0}@media(max-width:800px){main{grid-template-columns:1fr}iframe{height:550px}}
</style>
<header><strong>TECH-TRAC UK</strong><span>Website Builder</span><small>Frontend prototype · not connected to Microweber</small><nav><button id="save">Save locally</button><button id="export">Export this page</button></nav></header>
<p id="notice" role="status" aria-live="polite">Demo only: no hosting, accounts or domain publishing. Saves stay in this browser.</p>
<main><aside><label>Website name<input id="site" maxlength="100"></label><label>Accent colour<input id="colour" type="color"></label><h2>Pages</h2><label>Current page<select id="pages"></select></label><label>Page title<input id="pageTitle" maxlength="100"></label><nav><button id="addPage">Add page</button><button id="deletePage">Delete page</button></nav><hr><h2>Sections</h2><div id="sections"></div><button id="addSection">Add section</button><hr><h2>Selected section</h2><label>Heading<input id="heading" maxlength="200"></label><label>Body text<textarea id="body" maxlength="10000"></textarea></label><nav><button id="up">Move up</button><button id="down">Move down</button><button id="remove">Delete section</button></nav></aside><section class="workspace" aria-label="Website preview"><nav><button data-width="100%">Desktop</button><button data-width="768px">Tablet</button><button data-width="375px">Mobile</button></nav><p><small>Preview links are disabled. Export downloads only the selected page; it does not publish a site.</small></p><iframe id="preview" title="Customer website preview" sandbox=""></iframe></section></main>
<script>
'use strict';
const $=id=>document.getElementById(id),key='techtrac.builder.demo.v1';
const initial=()=>({name:'Your business',colour:'#06b6d4',pages:[{title:'Home',sections:[{heading:'A better website starts here.',body:'Tell your customers what makes your business different.'},{heading:'What we do',body:'Introduce your services, your expertise and your team.'}]}]});
let state=initial(),p=0,s=0,dirty=false;
const esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function valid(v){return v&&typeof v.name==='string'&&/^#[0-9a-f]{6}$/i.test(v.colour)&&Array.isArray(v.pages)&&v.pages.length>0&&v.pages.length<=20&&v.pages.every(x=>typeof x.title==='string'&&Array.isArray(x.sections)&&x.sections.length>0&&x.sections.length<=50&&x.sections.every(y=>typeof y.heading==='string'&&typeof y.body==='string'));}
try{const raw=localStorage.getItem(key);if(raw){const v=JSON.parse(raw);if(valid(v))state=v;else $('notice').textContent='Saved demo data is invalid; showing a fresh demo without overwriting it.';}}catch(e){$('notice').textContent='Local storage could not be loaded. Editing and HTML export remain available.';}
function page(){return state.pages[p];}function selected(){return page().sections[s];}
function html(){return '<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>'+esc(page().title)+' | '+esc(state.name)+'</title><style>body{margin:0;font:18px/1.7 system-ui;color:#142235;background:#f7fafc}header,main,footer{max-width:1050px;margin:auto;padding:28px}header{border-bottom:4px solid '+state.colour+'}section{padding:36px 0;border-bottom:1px solid #dce4ed}h1,h2{line-height:1.2}h1{font-size:clamp(32px,6vw,62px)}p{white-space:pre-wrap;overflow-wrap:anywhere}h1,h2,header{overflow-wrap:anywhere}</style><header>'+esc(state.name)+'</header><main>'+page().sections.map((x,i)=>'<section><'+(i?'h2':'h1')+'>'+esc(x.heading)+'</'+(i?'h2':'h1')+'><p>'+esc(x.body)+'</p></section>').join('')+'</main><footer>'+esc(state.name)+'</footer></html>';}
function preview(){ $('preview').srcdoc=html(); }
function render(){ $('site').value=state.name;$('colour').value=state.colour;$('pageTitle').value=page().title;$('pages').replaceChildren(...state.pages.map((x,i)=>{const o=document.createElement('option');o.value=i;o.textContent=x.title;return o;}));$('pages').value=p;$('sections').replaceChildren(...page().sections.map((x,i)=>{const b=document.createElement('button'),r=document.createElement('div');r.className='row';b.textContent=x.heading||'Untitled section';b.className=i===s?'selected':'';b.setAttribute('aria-pressed',String(i===s));b.onclick=()=>{s=i;render();};r.append(b);return r;}));$('heading').value=selected().heading;$('body').value=selected().body;$('up').disabled=s===0;$('down').disabled=s===page().sections.length-1;$('remove').disabled=page().sections.length===1;$('deletePage').disabled=state.pages.length===1;preview();}
function changed(){dirty=true;$('notice').textContent='Unsaved demo changes. Save locally to retain them in this browser.';preview();}
$('site').oninput=e=>{state.name=e.target.value;changed();};$('colour').oninput=e=>{state.colour=e.target.value;changed();};$('pageTitle').oninput=e=>{page().title=e.target.value;$('pages').options[p].textContent=page().title;changed();};$('heading').oninput=e=>{selected().heading=e.target.value;$('sections').children[s].firstChild.textContent=selected().heading||'Untitled section';changed();};$('body').oninput=e=>{selected().body=e.target.value;changed();};$('pages').onchange=e=>{p=Number(e.target.value);s=0;render();};
$('addPage').onclick=()=>{if(state.pages.length>=20)return alert('Demo limit: 20 pages.');state.pages.push({title:'New page',sections:[{heading:'New page',body:'Add your content here.'}]});p=state.pages.length-1;s=0;changed();render();};$('deletePage').onclick=()=>{if(state.pages.length>1&&confirm('Delete this page from the demo?')){state.pages.splice(p,1);p=0;s=0;changed();render();}};
$('addSection').onclick=()=>{if(page().sections.length>=50)return alert('Demo limit: 50 sections per page.');page().sections.push({heading:'New section',body:'Write your content here.'});s=page().sections.length-1;changed();render();};$('remove').onclick=()=>{if(page().sections.length>1&&confirm('Delete this section?')){page().sections.splice(s,1);s=Math.min(s,page().sections.length-1);changed();render();}};
function move(n){const t=s+n;if(t<0||t>=page().sections.length)return;[page().sections[s],page().sections[t]]=[page().sections[t],page().sections[s]];s=t;changed();render();}$('up').onclick=()=>move(-1);$('down').onclick=()=>move(1);
$('save').onclick=()=>{try{localStorage.setItem(key,JSON.stringify(state));dirty=false;$('notice').textContent='Saved locally in this browser. Not saved to Microweber or published.';}catch(e){$('notice').textContent='Save failed: browser storage unavailable or full. Export this page to keep its HTML.';}};
$('export').onclick=()=>{const url=URL.createObjectURL(new Blob([html()],{type:'text/html;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download='website-page.html';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);};document.querySelectorAll('[data-width]').forEach(b=>b.onclick=()=>{$('preview').style.width=b.dataset.width;});window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue='';}});render();
</script></html>
